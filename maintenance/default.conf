server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    charset utf-8;

    add_header Cache-Control "no-store" always;
    add_header Retry-After "3600" always;
    error_page 404 503 =503 /maintenance.html;

    location / {
        return 503;
    }

    location = /maintenance.html {
        internal;
    }
}
